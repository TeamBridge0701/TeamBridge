# EC2 Ubuntu 운영 환경 설정. 비밀번호와 도메인은 systemd 환경변수로만 전달한다.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:groupware}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.thymeleaf.cache=true

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# systemd의 WorkingDirectory와 무관하게 업로드 파일을 서버의 영속 경로에 보관한다.
groupware.upload-root=${GROUPWARE_UPLOAD_ROOT:/home/ubuntu/teambridge/uploads}
groupware.chat.upload-dir=${groupware.upload-root}/chat
groupware.archive.upload-dir=${groupware.upload-root}/archive
groupware.approval.upload-dir=${groupware.upload-root}/approval
groupware.profileImg.upload-dir=${groupware.upload-root}/profileImg

# 예: GROUPWARE_WEBSOCKET_ALLOWED_ORIGINS=https://teambridge.example.com
groupware.websocket.allowed-origins=${GROUPWARE_WEBSOCKET_ALLOWED_ORIGINS}
