spring.application.name=groupware
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# EC2에서는 Nginx가 HTTPS 요청을 Spring Boot로 전달하므로 원래 프로토콜 정보를 신뢰한다.
server.forward-headers-strategy=framework
server.port=${SERVER_PORT:8810}
server.servlet.session.tracking-modes=cookie

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 쉼표로 여러 주소를 지정한다. prod에서는 환경변수로 HTTPS 도메인만 넣는다.
groupware.websocket.allowed-origins=http://localhost:8810,http://127.0.0.1:8810

# API 키는 로컬 터미널 또는 EC2 systemd 환경변수에서만 주입한다.
weather.api.key=b4fbc047235966bcd6b6eef5ece76ddc
weather.api.city=Seoul
